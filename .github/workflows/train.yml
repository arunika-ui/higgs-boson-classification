name: train on CERN open data
# Downloads the ATLAS dataset, trains all models, and commits the results + figures.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "requirements.txt", ".github/workflows/train.yml"]
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache dataset
        uses: actions/cache@v4
        with:
          path: data
          key: atlas-higgs-2014-v2
      - name: Train and evaluate
        run: PYTHONPATH=src python -m higgs.train
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "Update results from training run [skip ci]"
          git push
